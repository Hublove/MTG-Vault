{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MTG Vault{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <nav class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-6">
      <a href="{% url 'cards:vault' %}" class="text-lg font-bold tracking-tight text-indigo-400">
        🃏 MTG Vault
      </a>
      <div class="flex items-center gap-4 text-sm">
        <a href="{% url 'cards:vault' %}" class="hover:text-indigo-300">Vault</a>
        <a href="{% url 'decks:list' %}" class="hover:text-indigo-300">Decks</a>
        <a href="{% url 'cards:commander_list' %}" class="hover:text-indigo-300">Commanders</a>
        <a href="{% url 'cards:tag_list' %}" class="hover:text-indigo-300">Tags</a>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <a href="{% url 'cards:card_add' %}"
           class="rounded-md bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 text-sm font-medium">
          + Add card
        </a>
        <a href="{% url 'decks:create' %}"
           class="rounded-md bg-slate-800 hover:bg-slate-700 px-3 py-1.5 text-sm font-medium border border-slate-700">
          + New deck
        </a>
      </div>
    </div>
  </nav>

  {% if messages %}
    <div class="max-w-7xl mx-auto px-4 mt-4 space-y-2">
      {% for message in messages %}
        <div class="rounded-md px-4 py-2 text-sm border
          {% if message.tags == 'error' %}bg-rose-950/60 border-rose-800 text-rose-200
          {% elif message.tags == 'warning' %}bg-amber-950/60 border-amber-800 text-amber-200
          {% elif message.tags == 'success' %}bg-emerald-950/60 border-emerald-800 text-emerald-200
          {% else %}bg-slate-800/60 border-slate-700 text-slate-200{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
