{% comment %}
Dropdown filter over (value, label) pairs.
Params: label, name, pairs (iterable of 2-tuples), selected.
{% endcomment %}
<div>
  <label class="block text-xs uppercase tracking-wide text-slate-500 mb-1">{{ label }}</label>
  <select name="{{ name }}" class="w-full rounded-md bg-slate-800 border border-slate-700 px-2 py-1.5 text-sm">
    <option value="">All</option>
    {% for value, text in pairs %}
      <option value="{{ value }}" {% if selected == value|stringformat:'s' %}selected{% endif %}>{{ text }}</option>
    {% endfor %}
  </select>
</div>
