{% extends "base.html" %}
{% block title %}Delete tag{% endblock %}

{% block content %}
<div class="max-w-md mx-auto rounded-xl border border-slate-800 bg-slate-900/50 p-6">
  <h1 class="text-lg font-bold mb-2">Delete “{{ object.name }}”?</h1>
  <p class="text-slate-400 text-sm mb-4">This removes the tag from all cards. The cards themselves are kept.</p>
  <form method="post" class="flex gap-2">
    {% csrf_token %}
    <button class="rounded-md bg-rose-600 hover:bg-rose-500 px-3 py-1.5 text-sm font-medium">Delete</button>
    <a href="{% url 'cards:tag_list' %}" class="rounded-md bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 text-sm">Cancel</a>
  </form>
</div>
{% endblock %}
